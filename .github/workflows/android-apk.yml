name: Build Euro Haul Android APK

on:
  push:
    branches: [main]
    paths:
      - 'overrides/**'
      - '.github/workflows/android-apk.yml'
      - 'Euro_Haul_Step1_Godot_Free.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Euro Haul
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Extract project
        run: |
          unzip -o Euro_Haul_Step1_Godot_Free.zip -d .
          test -f Euro_Haul_Step1/package.json
      - name: Download pinned Kenney CC0 3D asset packs
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Hidencod/tge-assets.git /tmp/kenney-library
          cd /tmp/kenney-library
          git sparse-checkout init --cone
          git sparse-checkout set packs/car-kit packs/city-kit-roads packs/city-kit-commercial packs/nature-kit
          git checkout 3ddcc695adbba9fb918cf31b7c139b3f95b76910
          cd "$GITHUB_WORKSPACE"
          mkdir -p Euro_Haul_Step1/public/assets/kenney
          cp -a /tmp/kenney-library/packs/. Euro_Haul_Step1/public/assets/kenney/
          curl -fsSL https://raw.githubusercontent.com/Hidencod/tge-assets/3ddcc695adbba9fb918cf31b7c139b3f95b76910/LICENSE -o Euro_Haul_Step1/public/assets/kenney/LICENSE.txt
          MODEL_COUNT=$(find Euro_Haul_Step1/public/assets/kenney -type f -name '*.glb' | wc -l)
          ASSET_BYTES=$(du -sb Euro_Haul_Step1/public/assets/kenney | cut -f1)
          echo "Downloaded $MODEL_COUNT CC0 GLB models ($ASSET_BYTES bytes)"
          test "$MODEL_COUNT" -ge 400
          mkdir -p Euro_Haul_Step1/public/assets/longhaul
          curl -fsSL https://cdn.3dassets.dev/assets/13943/v1/model.glb -o Euro_Haul_Step1/public/assets/longhaul/long-nose-sleeper.glb
          curl -fsSL https://cdn.3dassets.dev/assets/13946/v1/model.glb -o Euro_Haul_Step1/public/assets/longhaul/cabover-sleeper.glb
          curl -fsSL 'https://cdn.3dassets.dev/assets/13950/v1/model.glb' -o Euro_Haul_Step1/public/assets/longhaul/dry-van-trailer.glb
          curl -fsSL https://cdn.3dassets.dev/assets/14029/v1/model.glb -o Euro_Haul_Step1/public/assets/longhaul/truck-stop-yard.glb
          curl -fsSL https://creativecommons.org/publicdomain/zero/1.0/legalcode.txt -o Euro_Haul_Step1/public/assets/longhaul/CC0-LICENSE.txt
          echo "Added CC0 tractor, trailer and truck-stop scene models"
      - name: Apply upgraded game files
        run: |
          cp overrides/src/main.js Euro_Haul_Step1/src/main.js
          cp overrides/src/style.css Euro_Haul_Step1/src/style.css
      - name: Install dependencies
        working-directory: Euro_Haul_Step1
        run: npm install
      - name: Install matching Babylon GLB loader
        working-directory: Euro_Haul_Step1
        run: |
          BABYLON_VERSION=$(node -p "require('./node_modules/babylonjs/package.json').version")
          npm install --save-exact "babylonjs-loaders@$BABYLON_VERSION"
      - name: Build Babylon.js game
        working-directory: Euro_Haul_Step1
        run: npm run build
      - name: Add Android platform
        working-directory: Euro_Haul_Step1
        run: npx cap add android
      - name: Sync Android project
        working-directory: Euro_Haul_Step1
        run: npx cap sync android
      - name: Build APK
        working-directory: Euro_Haul_Step1/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify APK and report package size
        run: |
          APK="Euro_Haul_Step1/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          APK_BYTES=$(stat -c%s "$APK")
          APK_MB=$(awk "BEGIN {printf \"%.2f\", $APK_BYTES/1048576}")
          MODEL_COUNT=$(unzip -l "$APK" | awk '$4 ~ /kenney\/.*\.glb$/ {count++} END {print count+0}')
          ASSET_BYTES=$(unzip -l "$APK" | awk '$4 ~ /kenney\/.*\.glb$/ {sum+=$1} END {print sum+0}')
          ASSET_MB=$(awk "BEGIN {printf \"%.2f\", $ASSET_BYTES/1048576}")
          echo "## Packaged game content" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kenney CC0 GLB models packaged: $MODEL_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Uncompressed GLB payload: $ASSET_MB MB ($ASSET_BYTES bytes)" >> "$GITHUB_STEP_SUMMARY"
          TRUCK_MODEL_COUNT=$(unzip -l "$APK" | awk '$4 ~ /longhaul\/.*\.glb$/ {count++} END {print count+0}')
          TRUCK_MODEL_BYTES=$(unzip -l "$APK" | awk '$4 ~ /longhaul\/.*\.glb$/ {sum+=$1} END {print sum+0}')
          TRUCK_MODEL_MB=$(awk "BEGIN {printf \"%.2f\", $TRUCK_MODEL_BYTES/1048576}")
          echo "- Additional long-haul tractor/trailer/yard GLBs: $TRUCK_MODEL_COUNT ($TRUCK_MODEL_MB MB)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Actual APK file: $APK_MB MB ($APK_BYTES bytes)" >> "$GITHUB_STEP_SUMMARY"
          TOTAL_ASSET_BYTES=$((ASSET_BYTES + TRUCK_MODEL_BYTES))
          TOTAL_ASSET_MB=$(awk "BEGIN {printf \"%.2f\", $TOTAL_ASSET_BYTES/1048576}")
          echo "- Total uncompressed 3D model payload: $TOTAL_ASSET_MB MB ($TOTAL_ASSET_BYTES bytes)" >> "$GITHUB_STEP_SUMMARY"
          echo "MEASURED_APK=$APK_MB MiB ($APK_BYTES bytes); Kenney_models=$MODEL_COUNT; longhaul_models=$TRUCK_MODEL_COUNT; 3D_payload=$TOTAL_ASSET_MB MiB"
          if [ "$MODEL_COUNT" -lt 400 ]; then
            echo "Expected 400+ GLB files inside APK; found $MODEL_COUNT" >&2
            exit 1
          fi
          if [ "$APK_BYTES" -lt 419430400 ]; then
            echo "400 MiB content target not reached; no filler data has been added." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "APK_SIZE_BYTES=$APK_BYTES" >> "$GITHUB_STEP_SUMMARY"
          echo "APK_SIZE_MB=$APK_MB MB" >> "$GITHUB_STEP_SUMMARY"
          echo "APK SHA-256:" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" >> "$GITHUB_STEP_SUMMARY"
          if [ "$APK_BYTES" -gt 734003200 ]; then
            echo "APK exceeds the 700 MiB project limit" >&2
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Euro-Haul-Android-APK
          path: Euro_Haul_Step1/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
