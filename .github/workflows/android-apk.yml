
name: Build Euro Haul Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Euro Haul Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Check project ZIP
        run: |
          test -f Euro_Haul_Step1_Godot_Free.zip
          echo "Project ZIP found"

      - name: Extract Euro Haul project
        run: |
          unzip -o Euro_Haul_Step1_Godot_Free.zip -d .
          test -f package.json
          test -f capacitor.config.json
          echo "Project files found"

      - name: Install dependencies
        run: npm install

      - name: Build Babylon.js game
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload Euro Haul APK
        uses: actions/upload-artifact@v4
        with:
          name: Euro-Haul-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
