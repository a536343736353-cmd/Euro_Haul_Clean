
name: Build Euro Haul Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          unzip -o Euro_Haul_Step1_Godot_Free.zip -d .
          ls -la

      - name: Install dependencies
        run: npm install

      - name: Build game
        run: npm run build

      - name: Prepare Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Euro-Haul-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
